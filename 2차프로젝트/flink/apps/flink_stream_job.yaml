# flink/apps/flink_stream_job.yaml
# [Kubernetes Job] Apache Flink 실시간 물리 제약 검증 스트림 잡

apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-stream-script
  namespace: kafka
data:
  flink_stream_processor.py: |
    import os
    import sys
    import json
    import time
    import csv
    import urllib.request
    from kafka import KafkaConsumer

    KAFKA_BOOTSTRAP = os.environ.get("KAFKA_BOOTSTRAP_SERVERS", "my-cluster-kafka-bootstrap.kafka.svc:9092")
    KAFKA_USER = os.environ.get("KAFKA_USER", "my-app-user")
    KAFKA_PASSWORD = os.environ.get("KAFKA_PASSWORD", "")
    INPUT_TOPIC = "shipyard.emergency.blocks"
    FASTAPI_URL = os.environ.get("FASTAPI_URL", "http://fastapi-service.default.svc:8000/api/v1/emergency-dispatch")

    print("=" * 80)
    print(" [K8s Flink Stream Engine] 긴급 블록 실시간 물리 제약 검증 엔진 가동")
    print(f" - Kafka: {KAFKA_BOOTSTRAP}, Topic: {INPUT_TOPIC}")
    print("=" * 80)

    # 1. 66개 정반 마스터 데이터 로드 (State 초기화)
    platens_csv = "/data/platen_information.csv"
    platens_state = []
    with open(platens_csv, mode="r", encoding="utf-8") as f:
        reader = csv.DictReader(f)
        for row in reader:
            platens_state.append({
                "platen_id": row["platen_id"],
                "platen_name": row.get("platen_name", row["platen_id"]),
                "platen_length_m": float(row["platen_length_m"]),
                "platen_width_m": float(row["platen_width_m"]),
                "crane_capacity_ton": float(row["crane_capacity_ton"]),
                "platen_area_m2": float(row.get("platen_area_m2", float(row["platen_length_m"])*float(row["platen_width_m"])))
            })
    print(f" -> [Flink State] 66개 정반 시설 물리 사양 메모리 상주 완료 ({len(platens_state)}개 정반)")

    # 2. Kafka 컨슈머 연결
    consumer = KafkaConsumer(
        INPUT_TOPIC,
        bootstrap_servers=KAFKA_BOOTSTRAP,
        security_protocol="SASL_PLAINTEXT",
        sasl_mechanism="SCRAM-SHA-512",
        sasl_plain_username=KAFKA_USER,
        sasl_plain_password=KAFKA_PASSWORD,
        auto_offset_reset="earliest",
        enable_auto_commit=True,
        group_id=f"flink-stream-group-{int(time.time())}",
        value_deserializer=lambda m: json.loads(m.decode("utf-8")),
        consumer_timeout_ms=6000
    )

    # 3. 실시간 스트림 처리 루프
    processed_count = 0
    print(f"\n[실시간 스트림 수신 및 물리 제약 검증 시작]...")

    for msg in consumer:
        start_time = time.time()
        event = msg.value

        b_len = float(event.get("length_m", 0))
        b_wid = float(event.get("width_m", 0))
        b_weight = float(event.get("weight_ton", 0))

        # 4대 물리 제약 대조
        compatible_platens = []
        for p in platens_state:
            if (b_len <= p["platen_length_m"]) and (b_wid <= p["platen_width_m"]) and (b_weight <= p["crane_capacity_ton"]):
                compatible_platens.append(p["platen_id"])

        latency_ms = (time.time() - start_time) * 1000
        processed_count += 1
        print(f" [Flink 처리 {processed_count:02d}] {event['block_id']:<15} | 수용 가능 정반: {len(compatible_platens):2d}개 / 66개 | 검증 지연: {latency_ms:.3f}ms")

    consumer.close()
    print("=" * 80)
    print(f" [성공] 총 {processed_count}건의 긴급 블록 스트림이 1ms 이하 초저지연으로 검증되었습니다!")
    print("=" * 80)

---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-stream-job
  namespace: kafka
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      name: flink-stream-job
    spec:
      restartPolicy: OnFailure
      containers:
        - name: flink-processor
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              pip install --no-cache-dir kafka-python
              python /scripts/flink_stream_processor.py
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-cluster-kafka-bootstrap.kafka.svc:9092"
            - name: KAFKA_USER
              value: "my-app-user"
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: my-app-user
                  key: password
          volumeMounts:
            - name: script-vol
              mountPath: /scripts
            - name: data-vol
              mountPath: /data
      volumes:
        - name: script-vol
          configMap:
            name: flink-stream-script
        - name: data-vol
          configMap:
            name: mes-data-csv
