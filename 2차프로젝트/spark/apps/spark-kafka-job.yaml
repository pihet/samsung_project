# spark/apps/spark-kafka-job.yaml
# [실전 배포] Kafka [my-topic] 연동 PySpark 분산 처리 SparkApplication

apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: spark-kafka-order-analytics
  namespace: spark
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "docker.io/apache/spark:3.5.1"
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///mnt/spark-code/spark_kafka_consumer.py"
  sparkVersion: "3.5.1"
  restartPolicy:
    type: Never

  # Ivy 의존성 다운로드 캐시 경로를 쓰기 가능한 /tmp/.ivy로 설정 ⭐
  sparkConf:
    "spark.jars.ivy": "/tmp/.ivy"

  # Spark Kafka 공식 커넥터 패키지 자동 다운로드 주입 ⭐
  deps:
    packages:
      - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1"

  # ConfigMap에 저장된 파이썬 코드를 /mnt/spark-code 로 마운트 ⭐
  volumes:
    - name: spark-code-volume
      configMap:
        name: spark-kafka-code

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "1024m"
    labels:
      version: 3.5.1
    serviceAccount: spark
    volumeMounts:
      - name: spark-code-volume
        mountPath: /mnt/spark-code

  executor:
    cores: 1
    instances: 2              # 👈 2대의 Executor가 카프카 파티션을 나누어 분산 처리!
    memory: "1024m"
    labels:
      version: 3.5.1
    volumeMounts:
      - name: spark-code-volume
        mountPath: /mnt/spark-code
