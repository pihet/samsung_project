# frontend/k8s/react-frontend.yaml
# [React 프론트엔드 대시보드 Deployment & Service]

apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-frontend
  namespace: default
  labels:
    app: react-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-frontend
  template:
    metadata:
      labels:
        app: react-frontend
    spec:
      containers:
        - name: react-app
          image: "node:18-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo " Initializing React project workspace..."
              mkdir -p /app/src /app/public
              cp -L -r /opt/src/. /app/src/
              cp -L -r /opt/public/. /app/public/
              cp -L /opt/package.json /app/package.json
              cd /app
              echo " Workspace files verified:"
              ls -la /app/public /app/src
              echo " Installing dependencies..."
              npm install --silent
              echo " Starting React Dev Server on 0.0.0.0:3000..."
              export HOST=0.0.0.0
              export DANGEROUSLY_DISABLE_HOST_CHECK=true
              npm start
          workingDir: /app
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          volumeMounts:
            - name: frontend-src
              mountPath: /opt/src
            - name: frontend-public
              mountPath: /opt/public
            - name: frontend-pkg
              mountPath: /opt/package.json
              subPath: package.json
      volumes:
        - name: frontend-src
          configMap:
            name: react-src-code
        - name: frontend-public
          configMap:
            name: react-public-code
        - name: frontend-pkg
          configMap:
            name: react-pkg-code

---
apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service
  namespace: default
  labels:
    app: react-frontend
spec:
  type: ClusterIP
  selector:
    app: react-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
